name: Deploy Mermaid Docs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Render Mermaid Diagrams using Docker
        run: |
          cd docs
          # 创建无沙箱配置文件
          echo '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' > puppeteer-config.json
          
          for file in $(find . -name '*.md'); do
            [ -f "$file" ] || continue
            echo "Rendering: $file"
            
            # 使用官方 Docker 镜像渲染，映射当前目录，并指定用户避免文件权限问题
            docker run --rm -u $(id -u):$(id -g) -v $(pwd):/data minlag/mermaid-cli -i "/data/$file" -o "/data/$file.tmp" -p /data/puppeteer-config.json || exit 1
            
            # 替换原文件
            mv "$file.tmp" "$file"
          done
          
          # 删除临时配置
          rm puppeteer-config.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
